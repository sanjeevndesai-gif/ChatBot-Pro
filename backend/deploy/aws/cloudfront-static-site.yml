AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static site hosting (S3 + CloudFront) for tridlio.com.
  IMPORTANT: Request or provide an ACM certificate in us-east-1 for CloudFront
  (ACM certificates for CloudFront must be in the us-east-1 region). This
  template expects an existing Certificate ARN in the same region you deploy
  this stack to (typically us-east-1).

Parameters:
  DomainName:
    Type: String
    Description: The site domain (e.g. tridlio.com)

  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for the domain

  CertificateArn:
    Type: String
    Description: ACM Certificate ARN for the CloudFront distribution (must be in us-east-1)

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront Price Class

Resources:

  StaticSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      AccessControl: Private
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "OAI for ${DomainName} static site"

  StaticSiteBucketAccessPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${DomainName}/*"

  StaticSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticSiteBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Aliases:
          - !Ref DomainName
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html

  SiteDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt StaticSiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront Hosted Zone ID (global)

Outputs:
  BucketName:
    Description: S3 bucket name for the static site
    Value: !Ref StaticSiteBucket

  CloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt StaticSiteDistribution.DomainName

  SiteUrl:
    Description: HTTPS URL for the site
    Value: !Sub "https://${DomainName}/"
