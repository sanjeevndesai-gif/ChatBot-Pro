name: CI Build & Deploy

on:
  push:
    branches: [ main, develop ]

env:
  AWS_REGION: ap-south-1
  STATIC_SITE_REGION: us-east-1
  ECR_PREFIX: chatbot-app
  SERVICES: auth-service book_appointment chat gateway i18n-service eureka-server

jobs:
  build_and_push_images:
    name: Build & push backend images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get AWS Account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          ACCOUNT=${{ steps.aws-account.outputs.account }}
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Create ECR repositories if missing
        run: |
          ACCOUNT=${{ steps.aws-account.outputs.account }}
          for svc in ${{ env.SERVICES }}; do
            repo="${{ env.ECR_PREFIX }}-${svc}"
            if ! aws ecr describe-repositories --repository-names "$repo" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repo" --region ${{ env.AWS_REGION }} || true
            fi
          done

      - name: Build and push images
        run: |
          set -e
          ACCOUNT=${{ steps.aws-account.outputs.account }}
          for svc in ${{ env.SERVICES }}; do
            repo="${{ env.ECR_PREFIX }}-${svc}"
            image="${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${repo}:${GITHUB_SHA}"
            echo "Building $svc -> $image"
            if [ -d "backend/$svc" ]; then
              docker buildx build --platform linux/amd64,linux/arm64 -t "$image" backend/$svc --push
            else
              echo "Warning: backend/$svc not found, skipping"
            fi
          done

  build_frontend_and_deploy_static:
    name: Build frontend, upload to S3, deploy CloudFront
    runs-on: ubuntu-latest
    needs: build_and_push_images
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for static site (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.STATIC_SITE_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        run: |
          cd frontend/chat_bot
          npm ci --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend/chat_bot
          npm run build --if-present

      - name: Deploy CloudFormation static site (create bucket, CF distribution)
        if: ${{ secrets.STATIC_SITE_DOMAIN != '' && secrets.HOSTED_ZONE_ID != '' && secrets.ACM_CERT_ARN != '' }}
        run: |
          aws cloudformation deploy \
            --template-file backend/deploy/aws/cloudfront-static-site.yml \
            --stack-name tridlio-static-site \
            --region ${{ env.STATIC_SITE_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides DomainName=${{ secrets.STATIC_SITE_DOMAIN }} HostedZoneId=${{ secrets.HOSTED_ZONE_ID }} CertificateArn=${{ secrets.ACM_CERT_ARN }}

      - name: Sync built frontend to S3 bucket
        if: ${{ secrets.STATIC_SITE_DOMAIN != '' }}
        run: |
          aws s3 sync frontend/chat_bot/dist/chatbot/ s3://${{ secrets.STATIC_SITE_DOMAIN }} --delete --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront (best-effort)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  deploy_backend:
    name: Deploy backend CloudFormation
    runs-on: ubuntu-latest
    needs: build_and_push_images
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend CloudFormation stack
        env:
          VpcId: ${{ secrets.VPC_ID }}
          PublicSubnetIds: ${{ secrets.PUBLIC_SUBNET_IDS }}
          PrivateSubnetIds: ${{ secrets.PRIVATE_SUBNET_IDS }}
          ACM_CERT_ARN: ${{ secrets.ACM_CERT_ARN }}
        run: |
          PARAMS=""
          if [ -n "$VpcId" ]; then PARAMS="$PARAMS VpcId=$VpcId"; fi
          if [ -n "$PublicSubnetIds" ]; then PARAMS="$PARAMS PublicSubnetIds=\"$PublicSubnetIds\""; fi
          if [ -n "$PrivateSubnetIds" ]; then PARAMS="$PARAMS PrivateSubnetIds=\"$PrivateSubnetIds\""; fi
          if [ -n "$ACM_CERT_ARN" ]; then PARAMS="$PARAMS AcmCertificateArn=$ACM_CERT_ARN"; fi

          aws cloudformation deploy --template-file backend/deploy/aws/cloudformation.yml \
            --stack-name chatbot-backend \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides $PARAMS
      
