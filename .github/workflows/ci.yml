name: CI
on:
  pull_request:
    branches: ["develop","main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
      - name: Build backend services
        run: |
          cd backend
          ./mvnw -v
          # build each service individually to speed up
          ./mvnw -f auth-service/pom.xml -DskipTests package || true
      - name: Build frontend
        run: |
          cd frontend/chat_bot
          npm ci
          npm run build --if-present
