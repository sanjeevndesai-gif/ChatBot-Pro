name: Deploy Prod
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Determine AWS account
        id: account
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: ECR login
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ env.ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build, tag and push backend images (prod)
        env:
          AWS_REGION: ap-south-1
          ECR_PREFIX: ${{ secrets.ECR_REPOSITORY_PREFIX }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e
          SERVICES=(gateway auth-service chat book-appointment i18n-service)
          for svc in "${SERVICES[@]}"; do
            REPO_NAME="$ECR_PREFIX-$svc"
            IMAGE_URI="${{ env.ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/$REPO_NAME"
            aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$REPO_NAME" || true
            docker build -t "$IMAGE_URI:$GITHUB_SHA" -f "backend/$svc/Dockerfile" "backend/$svc"
            docker push "$IMAGE_URI:$GITHUB_SHA"
            echo "$IMAGE_URI:$GITHUB_SHA" >> images-pushed.txt
          done

      - name: Register task definitions and update ECS services (force new deployment)
        env:
          AWS_REGION: ap-south-1
          ECR_PREFIX: ${{ secrets.ECR_REPOSITORY_PREFIX }}
          ENVIRONMENT: prod
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e
          CLUSTER_NAME="${ECR_PREFIX}-${ENVIRONMENT}-cluster"
          SERVICES=(gateway auth-service chat book-appointment i18n-service)
          for svc in "${SERVICES[@]}"; do
            FAMILY="${ECR_PREFIX}-${ENVIRONMENT}-$svc"
            SERVICE_NAME="${FAMILY}-svc"
            REPO_NAME="${ECR_PREFIX}-$svc"
            NEW_IMAGE="${{ env.ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO_NAME}:$GITHUB_SHA"
            echo "Processing service: $svc (cluster=$CLUSTER_NAME service=$SERVICE_NAME)"
            TASKDEF_ARN=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --query 'services[0].taskDefinition' --output text 2>/dev/null || true)
            if [ -z "$TASKDEF_ARN" ] || [ "$TASKDEF_ARN" = "None" ]; then
              echo "No existing task definition/service found for $SERVICE_NAME, skipping register/update."
              continue
            fi
            aws ecs describe-task-definition --task-definition "$TASKDEF_ARN" --query 'taskDefinition' > td.json
            jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' td.json > td2.json
            jq --arg img "$NEW_IMAGE" --arg name "$svc" '.containerDefinitions |= map(if .name == $name then .image = $img else . end)' td2.json > td3.json
            aws ecs register-task-definition --cli-input-json file://td3.json >/dev/null
            aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE_NAME" --force-new-deployment || true
          done

      - name: Terraform apply prod
        run: |
          cd backend/deploy/aws/terraform
          terraform init -input=false || true
          terraform apply -auto-approve -var="environment=prod"
