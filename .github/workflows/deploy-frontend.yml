name: Deploy Frontend Static Site

on:
  push:
    branches: [ main, develop ]
    paths:
      - frontend/chat_bot/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  STATIC_SITE_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy-frontend:
    name: Build frontend, upload to S3, deploy CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repo vars
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "ERROR: repository variable AWS_ROLE_ARN is not set. Set it in Settings → Secrets and variables → Actions → Variables.";
            exit 1
          fi

      - name: Configure AWS credentials for static site (OIDC)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.STATIC_SITE_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend deps
        run: |
          cd frontend/chat_bot
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            npm ci --legacy-peer-deps
          else
            echo "No lockfile found; running npm install (will produce a package-lock.json locally)."
            npm install --legacy-peer-deps
          fi

      - name: Build frontend
        run: |
          cd frontend/chat_bot
          npm run build --if-present

      - name: Deploy CloudFormation static site (create bucket, CF distribution)
        run: |
          if [ -n "${{ vars.STATIC_SITE_DOMAIN }}" ] && [ -n "${{ vars.HOSTED_ZONE_ID }}" ] && [ -n "${{ vars.ACM_CERT_ARN }}" ]; then
            aws cloudformation deploy \
              --template-file backend/deploy/aws/cloudfront-static-site.yml \
              --stack-name chatbot-static-site \
              --region ${{ env.STATIC_SITE_REGION }} \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameter-overrides DomainName=${{ vars.STATIC_SITE_DOMAIN }} HostedZoneId=${{ vars.HOSTED_ZONE_ID }} CertificateArn=${{ vars.ACM_CERT_ARN }}
          else
            echo "Skipping CloudFormation deploy — required repo vars not set"
          fi

      - name: Sync built frontend to S3 bucket
        run: |
          if [ -n "${{ vars.STATIC_SITE_DOMAIN }}" ]; then
            aws s3 sync frontend/chat_bot/dist/chatbot/ s3://${{ vars.STATIC_SITE_DOMAIN }} --delete --region ${{ env.AWS_REGION }}
          else
            echo "Skipping S3 sync — STATIC_SITE_DOMAIN not set"
          fi

      - name: Invalidate CloudFront (best-effort)
        run: |
          if [ -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          else
            echo "Skipping CloudFront invalidation — CLOUDFRONT_DISTRIBUTION_ID not set"
          fi
